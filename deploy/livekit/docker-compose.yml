services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  livekit:
    # Pin major.minor — avoid silent Opus/ICE regressions from :latest.
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: ["--config", "/etc/livekit/livekit.yaml"]
    # Единственный источник секретов — livekit.env (передаётся через --env-file).
    # Ключи в livekit.yaml не хранятся.
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:?run with --env-file livekit.env}: "${LIVEKIT_API_SECRET:?run with --env-file livekit.env}"'
    depends_on:
      - redis
    # Один UDP-порт с мультиплексированием (rtc.udp_port) вместо диапазона:
    # проброс 50000–60000 через docker-proxy порождает процесс на каждый порт.
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_STATIC_AUTH_SECRET:?run with --env-file livekit.env}"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  redis_data:
